syntax = "proto3";

package raft;

option go_package = "github.com/waiyneee/Kvstore/raft";

message LogEntry {
    int64 term = 1;
    string command = 2;
}

message AppendEntriesRequest {
    int64 term = 1;
    int32 leaderId = 2;
    int64 prevLogIndex = 3;
    int64 prevLogTerm = 4;
    repeated LogEntry entries = 5;
    int64 leaderCommit = 6;
}

message AppendEntriesResponse {
    int64 term = 1;
    bool success = 2;
}

message RequestVoteRequest {
    int64 term = 1;
    int32 candidateId = 2;
    int64 lastLogIndex = 3;
    int64 lastLogTerm = 4;
}

message RequestVoteResponse {
    int64 term = 1;
    bool voteGranted = 2;
}

service RaftLeaderElection {
    rpc AppendEntries(AppendEntriesRequest)
        returns (AppendEntriesResponse);

    rpc RequestVote(RequestVoteRequest)
        returns (RequestVoteResponse);
}